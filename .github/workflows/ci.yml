name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test:
    name: Test & Lint (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Node 18 dropped due to ESM compatibility issues with @analogjs/vite-plugin-angular
        # Angular 19 requires Node 18.19+ or Node 20+
        node-version: [20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: false
          flags: node-${{ matrix.node-version }}
        if: success() && matrix.node-version == 22
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build & Bundle Analysis
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Analyze bundle size
        id: bundle-size
        run: |
          if [ -d "dist/markdown_converter/browser" ]; then
            BUNDLE_SIZE=$(du -sh dist/markdown_converter/browser | cut -f1)
            BUNDLE_BYTES=$(du -sb dist/markdown_converter/browser | cut -f1)
            echo "📦 Bundle size: $BUNDLE_SIZE ($BUNDLE_BYTES bytes)"
            echo "bundle_size=$BUNDLE_SIZE" >> $GITHUB_OUTPUT
            echo "bundle_bytes=$BUNDLE_BYTES" >> $GITHUB_OUTPUT

            # Find largest files
            echo "### Largest files:"
            find dist/markdown_converter/browser -type f -exec du -h {} + | sort -rh | head -10
          else
            echo "Build directory not found"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-node-22
          path: dist/
          retention-days: 7

      - name: Comment bundle size on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          script: |
            const bundleSize = '${{ steps.bundle-size.outputs.bundle_size }}';
            const bundleBytes = parseInt('${{ steps.bundle-size.outputs.bundle_bytes }}');
            const status = bundleBytes < 5000000 ? '✅ optimal' : '⚠️ larger than recommended';
            const comment = [
              '## 📊 Build Report',
              '',
              '### Bundle Size',
              `- **Total size**: ${bundleSize}`,
              `- **Total bytes**: ${bundleBytes.toLocaleString()} bytes`,
              '',
              '### Status',
              `${status} (threshold: 5MB)`,
              '',
              '---',
              '*Generated by CI/CD Pipeline*'
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
