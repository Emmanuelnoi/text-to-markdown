<div
  class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
  *ngIf="isOpen"
  (click)="close()"
  (keydown.escape)="close()"
  tabindex="0"
  role="dialog"
  aria-modal="true">
  <div
    class="bg-white dark:bg-gray-800 rounded-lg p-6 w-full max-w-md mx-4"
    (click)="$event.stopPropagation()"
    (keydown)="$event.stopPropagation()"
    tabindex="-1">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-semibold text-gray-900 dark:text-white">Import Markdown</h2>
      <button
        (click)="close()"
        aria-label="Close"
        class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <div class="space-y-4">
      <!-- File Upload -->
      <div>
        <label
          for="fileInput"
          class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
          Upload Markdown File
        </label>
        <div
          class="border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-lg p-4 text-center hover:border-gray-400 dark:hover:border-gray-500 transition-colors"
          (dragover)="onDragOver($event)"
          (dragleave)="onDragLeave($event)"
          (drop)="onDrop($event)"
          [class.border-blue-500]="isDragOver">
          <input
            #fileInput
            id="fileInput"
            type="file"
            accept=".md,.markdown"
            (change)="onFileSelected($event)"
            class="hidden" />
          <div class="space-y-2">
            <svg
              class="mx-auto h-12 w-12 text-gray-400"
              stroke="currentColor"
              fill="none"
              viewBox="0 0 48 48">
              <path
                d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
            <div class="text-sm text-gray-600 dark:text-gray-400">
              <button
                (click)="fileInput.click()"
                class="font-medium text-blue-600 hover:text-blue-500 dark:text-blue-400">
                Click to upload
              </button>
              or drag and drop
            </div>
            <p class="text-xs text-gray-500 dark:text-gray-500">.md or .markdown files only</p>
          </div>
        </div>
      </div>

      <!-- URL Import -->
      <div>
        <label
          for="urlInput"
          class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
          Import from URL
        </label>
        <div class="flex space-x-2">
          <input
            id="urlInput"
            [(ngModel)]="importUrl"
            type="url"
            placeholder="https://raw.githubusercontent.com/user/repo/main/README.md"
            class="flex-1 border border-gray-300 dark:border-gray-600 rounded-md px-3 py-2 text-sm bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
          <button
            (click)="importFromUrl()"
            [disabled]="!importUrl || isImporting"
            class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed">
            @if (isImporting) {
              <svg
                class="animate-spin h-4 w-4"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24">
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"></circle>
                <path
                  class="opacity-75"
                  fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
            } @else {
              Import
            }
          </button>
        </div>
        <p class="text-xs text-gray-500 dark:text-gray-500 mt-1">
          Paste a direct link to a markdown file (GitHub raw URLs work great)
        </p>
      </div>

      <!-- Quick Templates -->
      <div>
        <div class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
          Quick Start Templates
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button
            (click)="loadTemplate('readme')"
            class="p-3 text-left border border-gray-300 dark:border-gray-600 rounded-md transition-colors relative template-button">
            <div class="font-medium text-sm text-gray-900 dark:text-white">README</div>
            <div class="text-xs text-gray-500 dark:text-gray-400">Project documentation</div>
          </button>
          <button
            (click)="loadTemplate('blog')"
            class="p-3 text-left border border-gray-300 dark:border-gray-600 rounded-md transition-colors relative template-button">
            <div class="font-medium text-sm text-gray-900 dark:text-white">Blog Post</div>
            <div class="text-xs text-gray-500 dark:text-gray-400">Article template</div>
          </button>
          <button
            (click)="loadTemplate('meeting')"
            class="p-3 text-left border border-gray-300 dark:border-gray-600 rounded-md transition-colors relative template-button">
            <div class="font-medium text-sm text-gray-900 dark:text-white">Meeting Notes</div>
            <div class="text-xs text-gray-500 dark:text-gray-400">Meeting template</div>
          </button>
          <button
            (click)="loadTemplate('docs')"
            class="p-3 text-left border border-gray-300 dark:border-gray-600 rounded-md transition-colors relative template-button">
            <div class="font-medium text-sm text-gray-900 dark:text-white">Documentation</div>
            <div class="text-xs text-gray-500 dark:text-gray-400">Technical docs</div>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
